services:
  - type: web
    name: ai-recruiter-copilot-backend
    env: python
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "python -m uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.1-8b-instant
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.0-flash-lite
      - key: OPENAI_API_KEY
        sync: false
      - key: MOCK_SMTP
        value: "true"
      - key: DATABASE_URL
        value: sqlite:///backend/app/db/recruiter_copilot.db
